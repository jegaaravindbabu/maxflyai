<title>ceyonai theme options</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Sora:wght@400;600;800&family=Archivo:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#0a0a0c;color:#eee;font-family:Inter,system-ui,sans-serif;padding:26px;}
  h1.pg{font-size:20px;margin:0 0 4px;}
  .psub{color:#9aa0ad;font-size:13px;margin:0 0 22px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;max-width:1100px;}
  @media(max-width:820px){.grid{grid-template-columns:1fr;}}
  .opt{border-radius:16px;overflow:hidden;border:1px solid #23252e;}
  .lbl{padding:12px 16px;background:#141620;display:flex;justify-content:space-between;align-items:baseline;}
  .lbl b{font-size:15px;}.lbl span{font-size:11px;color:#8b90a0;}
  .mock{padding:26px 22px 30px;min-height:300px;}
  .mnav{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:26px;}
  .dot{width:16px;height:16px;border-radius:5px;}
  .eb{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:1.5px;padding:4px 10px;border-radius:999px;text-transform:uppercase;margin-bottom:12px;}
  .mh{font-size:30px;line-height:1.03;margin:0 0 10px;}
  .ms{font-size:12.5px;line-height:1.5;margin:0 0 16px;max-width:330px;}
  .mb{display:inline-block;font-size:12px;font-weight:700;padding:9px 16px;border-radius:999px;cursor:default;}
  .mb2{display:inline-block;font-size:12px;font-weight:700;padding:8px 15px;border-radius:999px;margin-left:8px;}
  .vid{margin-top:20px;height:60px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;}

  /* A — Editorial Light */
  .A{background:#f5f4f0;color:#141414;}
  .A .mh{font-family:"Space Grotesk";font-weight:700;letter-spacing:-1.5px;color:#111;}
  .A .hl{color:#2743ff;}
  .A .eb{background:#e7e6e1;color:#444;}
  .A .ms{color:#5c5c5c;}
  .A .mb{background:#111;color:#fff;}
  .A .mb2{background:transparent;color:#111;border:1.5px solid #111;}
  .A .vid{background:#eceae4;color:#8a8a82;border:1px solid #ddd;}
  .A .dot{background:#2743ff;}

  /* B — Neo-brutalist */
  .B{background:#c8f24e;color:#111;}
  .B .mh{font-family:"Archivo";font-weight:900;letter-spacing:-1px;text-transform:uppercase;}
  .B .hl{background:#111;color:#c8f24e;padding:0 4px;}
  .B .eb{background:#111;color:#c8f24e;border-radius:0;}
  .B .ms{color:#1c1c1c;font-weight:600;}
  .B .mb{background:#111;color:#fff;border-radius:0;box-shadow:4px 4px 0 #000;}
  .B .mb2{background:#fff;color:#111;border-radius:0;border:2px solid #111;box-shadow:4px 4px 0 #000;}
  .B .vid{background:#fff;border:2px solid #111;box-shadow:5px 5px 0 #111;color:#111;border-radius:0;}
  .B .dot{background:#111;border-radius:3px;}

  /* C — Aurora Glass (light) */
  .C{background:radial-gradient(120% 90% at 10% 0%,#e9d5ff 0%,transparent 45%),radial-gradient(100% 80% at 100% 10%,#c7f0ff 0%,transparent 50%),radial-gradient(90% 90% at 60% 100%,#ffe0ec 0%,transparent 55%),#fbfbff;color:#1a1730;}
  .C .mh{font-family:"Sora";font-weight:800;letter-spacing:-1px;}
  .C .hl{background:linear-gradient(90deg,#7c3aed,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .C .eb{background:rgba(124,58,237,.12);color:#7c3aed;border:1px solid rgba(124,58,237,.3);}
  .C .ms{color:#5b5674;}
  .C .mb{background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;}
  .C .mb2{background:rgba(255,255,255,.6);color:#3a2f66;border:1px solid #e5ddff;backdrop-filter:blur(6px);}
  .C .vid{background:rgba(255,255,255,.55);border:1px solid #eadfff;color:#8b83a8;backdrop-filter:blur(6px);}
  .C .dot{background:linear-gradient(90deg,#7c3aed,#ec4899);}

  /* D — Neon on Charcoal */
  .D{background:#0e0f12;color:#f0f2ee;background-image:radial-gradient(#1c1e24 1px,transparent 1px);background-size:20px 20px;}
  .D .mh{font-family:"Space Grotesk";font-weight:700;letter-spacing:-1px;}
  .D .hl{color:#c6ff3a;}
  .D .eb{background:rgba(198,255,58,.12);color:#c6ff3a;border:1px solid rgba(198,255,58,.3);}
  .D .ms{color:#9aa08f;}
  .D .mb{background:#c6ff3a;color:#12160a;}
  .D .mb2{background:transparent;color:#f0f2ee;border:1px solid #33362e;}
  .D .vid{background:#15171b;border:1px solid #24272e;color:#7c8172;}
  .D .dot{background:#c6ff3a;}
</style>

<h1 class="pg">Four fresh directions for ceyonai</h1>
<p class="psub">Same copy, four different themes. Pick a letter and I'll mock it up in full, then rebuild the page.</p>

<div class="grid" id="g"></div>
<script>
const T=[
 {c:"A",name:"A · Editorial Light",tag:"minimal • premium • cobalt accent"},
 {c:"B",name:"B · Neo-brutalist",tag:"loud • lime • chunky borders"},
 {c:"C",name:"C · Aurora Glass",tag:"light • colorful • frosted"},
 {c:"D",name:"D · Neon on Charcoal",tag:"dark done differently • lime pop"},
];
document.getElementById("g").innerHTML=T.map(t=>`
 <div class="opt">
   <div class="lbl"><b>${t.name}</b><span>${t.tag}</span></div>
   <div class="mock ${t.c}">
     <div class="mnav"><span class="dot"></span><b>ceyonai</b><span style="margin-left:auto;opacity:.6">Features · Pricing · Login</span></div>
     <span class="eb">✦ Made for Indian creators</span>
     <div class="mh">Edit your video in <span class="hl">minutes,<br>not hours.</span></div>
     <div class="ms">Auto-captions in your language, cuts the dead air and retakes, finished cut in minutes.</div>
     <span class="mb">Start editing free</span><span class="mb2">See plans</span>
     <div class="vid">▶  video preview</div>
   </div>
 </div>`).join("");
</script>
