# Local dev services for maxfly.ai (Postgres + Redis).
# The app itself runs outside compose during dev (uvicorn / vite),
# but you can point DATABASE_URL / REDIS_URL at these.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maxfly
      POSTGRES_PASSWORD: maxfly
      POSTGRES_DB: maxfly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
